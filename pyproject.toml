[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookmark-audio-daemon"
version = "0.1.0"
description = "A local macOS daemon that downloads audio from Vivaldi music bookmarks"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Sergio"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: MacOS X",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
bookmark-audio-daemon = "bookmark_audio_daemon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/bookmark_audio_daemon/tests"]
